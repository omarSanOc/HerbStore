name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x # package.json requires >=22.18
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mock-server/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: App tests (node:test and Jest)
        run: npm test

      - name: Install mock server dependencies
        run: npm --prefix mock-server ci

      - name: Mock server tests
        run: npm --prefix mock-server test
