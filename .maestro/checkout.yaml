appId: com.herbstore.mobile
name: Critical flow - search, add, address, double tap, ONE order
tags:
  - critical
# Inputs, passed with `maestro test -e KEY=VALUE` (this flow defines NO default values on
# purpose: Maestro 2.11.0 gives a flow's own `env:` block precedence over `-e` AND over the env
# passed by a parent runFlow — measured in spec 007 T10 — so any default here would silently
# defeat every override; see .maestro/README.md, "Variables"). Nothing here is a secret or a real
# person.
#   API_ORIGIN      where the HOST reaches the persistent API (scripts run on the Mac)
#   METRO_URL       the Metro of the Development Build, as the DEVICE reaches it
#   PRODUCT_QUERY   query that matches exactly one catalog product (so "first result" is
#                   unambiguous; e.g. "Evening Magnesium Powder", Verdant Forge, fictional)
#   PRODUCT_ID      the catalog product the flow will buy (must exist and have stock > 0)
#   E2E_EXCLUSIVE   MUST be "true": the operator's declaration of an EXCLUSIVE window. The API is
#                   persistent and shared, so without exclusivity a stock delta cannot be
#                   attributed to this run; reset-state.yaml stops as INCONCLUSA before mutating.
#                   Set it to "true" ONLY when that window really holds; see .maestro/README.md.
#   INTERFERENCE    "true" only when another client is KNOWN to have bought the same product
#                   meanwhile: the final stock delta is then recorded INCONCLUSA (not
#                   attributable) instead of a product failure.
# Missing values fail closed: the exclusivity gate sees an empty E2E_EXCLUSIVE and stops.
---
- runFlow:
    file: reset-state.yaml
    env:
      API_ORIGIN: ${API_ORIGIN}
      METRO_URL: ${METRO_URL}
      PRODUCT_ID: ${PRODUCT_ID}
      E2E_EXCLUSIVE: ${E2E_EXCLUSIVE}

# --- Search -------------------------------------------------------------------------------
- tapOn: "Search products"
# The search field has autoFocus: wait for the screen (empty history), then type into the focused field.
- extendedWaitUntil:
    visible: "You have not searched yet.*"
    timeout: 15000
- inputText: ${PRODUCT_QUERY}
# The keyboard's search key sends the search and closes the keyboard (also the explicit close here).
- pressKey: Enter
- extendedWaitUntil:
    visible: "1 product"
    timeout: 20000

# --- Add to cart --------------------------------------------------------------------------
# The card's accessible name is "<name>. <price>. ..." (the period tells it apart from the field text).
- tapOn: "${PRODUCT_QUERY}\\..*"
- extendedWaitUntil:
    visible: "Add to cart"
    timeout: 20000
- tapOn: "Add to cart"
- extendedWaitUntil:
    visible: "Cart, 1 item"
    timeout: 10000

# --- Cart -> checkout ----------------------------------------------------------------------
- tapOn: "Cart, 1 item"
- assertVisible: "1 product in your cart"
- tapOn: "Continue to checkout"
- extendedWaitUntil:
    visible: "Delivery details"
    timeout: 10000

# --- Address (valid, fictional); each field closes the keyboard ----------------------------
- runFlow:
    file: subflows/fill-field.yaml
    env: { FIELD_ID: checkout-fullName, CLOSE_WITH: enter, VALUE: "Ana Perez" }
- runFlow:
    file: subflows/fill-field.yaml
    env: { FIELD_ID: checkout-phone, CLOSE_WITH: hide, VALUE: "5512345678" }
- runFlow:
    file: subflows/fill-field.yaml
    env: { FIELD_ID: checkout-postalCode, CLOSE_WITH: hide, VALUE: "01234" }
- runFlow:
    file: subflows/fill-field.yaml
    env: { FIELD_ID: checkout-state, CLOSE_WITH: enter, VALUE: "Jalisco" }
- runFlow:
    file: subflows/fill-field.yaml
    env: { FIELD_ID: checkout-city, CLOSE_WITH: enter, VALUE: "Guadalajara" }
- runFlow:
    file: subflows/fill-field.yaml
    env: { FIELD_ID: checkout-street, CLOSE_WITH: enter, VALUE: "Avenida Central" }
- runFlow:
    file: subflows/fill-field.yaml
    env: { FIELD_ID: checkout-exteriorNumber, CLOSE_WITH: enter, VALUE: "10" }

# --- Double tap on "Continue" ----------------------------------------------------------------
- scrollUntilVisible:
    element: "Continue"
    timeout: 15000
# Two real taps 50 ms apart. `retryTapIfNoChange: false` stops Maestro from adding a THIRD tap by
# itself. The persistent API answers POST /orders on its own schedule (no ORDER_POST_DELAY_MS
# anymore), so the second tap MAY or MAY NOT land while the first request is in flight: the flow
# must yield ONE order in both cases. The deterministic single-POST race (delayed fetch, one key)
# lives in Jest/RNTL (checkout-thunks.test.tsx); Maestro only asserts the real observable outcome.
- tapOn:
    text: "Continue"
    repeat: 2
    delay: 50
    retryTapIfNoChange: false

# --- ONE confirmation --------------------------------------------------------------------------
- extendedWaitUntil:
    visible: "Order in progress|Order confirmed"
    timeout: 30000
# The API may answer 202 pending before confirming: the status screen unlocks "Check order status"
# once the attempt settles, and the flow polls until it confirms (or stays unresolved, which fails).
- runFlow:
    when:
      visible: "Order in progress"
    commands:
      - extendedWaitUntil:
          visible:
            text: "Check order status"
            enabled: true
          timeout: 15000
      - tapOn:
          text: "Check order status"
          retryTapIfNoChange: false
# Confirming schedules a local notification: the system permission alert may cover the screen. The
# alert is drawn by the OS in the DEVICE language (the app is pinned to English, the alert is not).
- extendedWaitUntil:
    visible: "Order confirmed|Allow|Permitir"
    timeout: 30000
- runFlow:
    when:
      visible: "Allow|Permitir"
    commands:
      - tapOn: "Allow|Permitir"
- assertVisible: "Order confirmed"
- assertVisible: "1 unit"

# --- Exactly one order, checked twice ------------------------------------------------------
# (a) Server: one order of one unit lowers the live stock by exactly 1. read-stock.js records the
#     final value (and re-checks health); check-delta.js compares it with the initial one captured
#     at preflight and decides green / real failure / INCONCLUSA (RF-43, RF-44). No reset anywhere.
- runScript:
    file: scripts/read-stock.js
    env:
      SLOT: final
- runScript:
    file: scripts/check-delta.js
    env:
      INTERFERENCE: ${INTERFERENCE}
# (b) App: "My orders" has one row and no second one. A row's accessible name ends in "total <amount>".
- tapOn: "Account"
- runFlow: subflows/open-my-orders.yaml
- extendedWaitUntil:
    visible: "Orders confirmed on this installation.*"
    timeout: 10000
- assertVisible:
    text: "Order .*total.*"
    index: 0
- assertNotVisible:
    text: "Order .*total.*"
    index: 1
