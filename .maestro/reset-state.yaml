appId: com.herbstore.mobile
name: Reset to a clean, deterministic state
# Inputs (env, all with defaults; override with `maestro test -e KEY=VALUE`):
#   API_ORIGIN    where the HOST reaches the mock server (scripts run on the Mac)
#   METRO_URL     the Metro of the Development Build, as the DEVICE reaches it
#   PRODUCT_ID    product whose live stock proves the mock was restarted
#   FRESH_STOCK   stock a freshly started mock reports for it
# Requires, in this order: (1) the mock restarted, (2) Metro running with
# EXPO_PUBLIC_API_ORIGIN, (3) on a physical Android, `adb reverse` for 8081 and 3001.
# See .maestro/README.md. Ends on Home, in English, with empty cart, history and orders.
env:
  API_ORIGIN: http://localhost:3001
  METRO_URL: http://localhost:8081
  PRODUCT_ID: product-261009-062
  FRESH_STOCK: "99"
---
# 1. The mock keeps orders and stock in memory and Maestro cannot restart it: it can only REFUSE
#    to run on top of a used one. A used mock means a previous purchase exists on the server.
- runScript:
    file: scripts/read-stock.js
    env:
      SLOT: initial
- assertTrue:
    condition: ${output.stock.initial == Number(FRESH_STOCK)}
    # `label` is shown as-is (Maestro does not interpolate it): keep it a plain sentence.
    label: "FAIL: the mock server already has orders (stock is not the fresh one). Restart it before running the flow."

# 1b. A failed earlier run can leave the OS notification-permission alert on screen (it belongs to the
#     system, not to the app, and survives the app being killed). It would cover the whole reset.
- runFlow:
    when:
      visible: "Don.t Allow|No permitir"
    commands:
      - tapOn: "Don.t Allow|No permitir"

# 2-4. App data to zero (clearState), Development Build pointed at Metro, English pinned, on Home.
#      Shared with the extra flows: see `subflows/fresh-app.yaml` (launcher race, Dev Menu, language).
- runFlow:
    file: subflows/fresh-app.yaml
    env:
      METRO_URL: ${METRO_URL}

# 5. Nothing from a previous run survives (RF-6 edge case: never continue over an existing purchase).
#    Opening "My orders" also proves the language is English now (the button is found by its English text).
- tapOn: "Account"
- runFlow: subflows/open-my-orders.yaml
- assertVisible: "You don't have any orders yet"
# Reselecting the active tab pops its stack back to the Account root (RF-37).
- tapOn: "Account"
- assertVisible: "React Native foundations"
- tapOn: "Home"
- assertVisible: "Search products"
# Empty cart = the tab label has no count.
- assertNotVisible: "Cart, .*"
